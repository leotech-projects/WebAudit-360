name: Map Adventure Biker BR

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-map.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Map public site
        run: python webaudit360.py https://adventurebikerbr.com/ --max-pages 150 --output audit-map
      - uses: actions/upload-artifact@v4
        with:
          name: adventure-biker-map
          path: audit-map/
          retention-days: 30
