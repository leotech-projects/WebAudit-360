name: Fast Audit Adventure Biker BR

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-adventure-fast.yml"
      - "webaudit360.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run HTTP audit
        run: |
          python webaudit360.py https://adventurebikerbr.com/ --max-pages 150 --output audit-fast

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: browser-actions/setup-chrome@v1

      - name: Lighthouse mobile
        run: |
          npx --yes lighthouse@12 https://adventurebikerbr.com/ --output=json --output=html --output-path=./audit-fast/lighthouse-mobile --only-categories=performance,accessibility,best-practices,seo --form-factor=mobile --screenEmulation.mobile=true --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
        continue-on-error: true

      - name: Lighthouse desktop
        run: |
          npx --yes lighthouse@12 https://adventurebikerbr.com/ --output=json --output=html --output-path=./audit-fast/lighthouse-desktop --only-categories=performance,accessibility,best-practices,seo --preset=desktop --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
        continue-on-error: true

      - name: Build Lighthouse summary
        if: always()
        run: |
          mkdir -p audit-fast
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path("audit-fast")
          rows=[]
          for profile,name in [("mobile","lighthouse-mobile.report.json"),("desktop","lighthouse-desktop.report.json")]:
              p=out/name
              if not p.exists(): continue
              d=json.loads(p.read_text())
              c=d.get("categories",{})
              a=d.get("audits",{})
              rows.append({
                "profile":profile,
                "performance":round((c.get("performance",{}).get("score") or 0)*100),
                "accessibility":round((c.get("accessibility",{}).get("score") or 0)*100),
                "best_practices":round((c.get("best-practices",{}).get("score") or 0)*100),
                "seo":round((c.get("seo",{}).get("score") or 0)*100),
                "fcp_ms":a.get("first-contentful-paint",{}).get("numericValue"),
                "lcp_ms":a.get("largest-contentful-paint",{}).get("numericValue"),
                "cls":a.get("cumulative-layout-shift",{}).get("numericValue"),
                "tbt_ms":a.get("total-blocking-time",{}).get("numericValue"),
                "speed_index_ms":a.get("speed-index",{}).get("numericValue"),
              })
          (out/"lighthouse-summary.json").write_text(json.dumps(rows,indent=2,ensure_ascii=False))
          print(json.dumps(rows,indent=2,ensure_ascii=False))
          PY

      - name: Upload fast audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adventure-biker-fast-audit
          path: audit-fast/
          retention-days: 30